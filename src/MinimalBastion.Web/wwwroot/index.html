<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#152d36" />
    <title>Minimal Bastion</title>
    <base href="./" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="browser-loading" class="loading-screen" role="status" aria-live="polite">
        <div class="loading-mark" aria-hidden="true"></div>
        <div class="loading-title">MINIMAL BASTION</div>
        <div id="browser-loading-copy" class="loading-copy">STARTING BROWSER RUNTIME</div>
        <div class="loading-track" aria-hidden="true">
            <div id="browser-loading-fill" class="loading-fill"></div>
        </div>
        <div id="browser-loading-percent" class="loading-percent">8%</div>
    </div>
    <div id="app"></div>

    <div id="blazor-error-ui" role="alert">
        <span id="browser-error-summary">The browser build stopped unexpectedly.</span>
        <a href="">Reload</a>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        window.minimalBastionLoading = (() => {
            const overlay = document.getElementById("browser-loading");
            const copy = document.getElementById("browser-loading-copy");
            const fill = document.getElementById("browser-loading-fill");
            const percent = document.getElementById("browser-loading-percent");
            let currentProgress = 0;
            return {
                update(progress, message) {
                    const bounded = Math.max(currentProgress, Math.max(0, Math.min(1, progress || 0)));
                    currentProgress = bounded;
                    if (copy) copy.textContent = message || "LOADING DEFENSE SYSTEMS";
                    if (fill) fill.style.width = `${Math.round(bounded * 100)}%`;
                    if (percent) percent.textContent = `${Math.round(bounded * 100)}%`;
                },
                complete() {
                    this.update(1, "DEFENSE SYSTEMS READY");
                    window.requestAnimationFrame(() => window.requestAnimationFrame(() => overlay?.classList.add("complete")));
                },
                fail() {
                    overlay?.classList.add("complete");
                }
            };
        })();
        minimalBastionLoading.update(0.08, "STARTING BROWSER RUNTIME");
        let frameworkLoading = true;
        function trackFrameworkLoading() {
            if (!frameworkLoading) return;
            const rawProgress = getComputedStyle(document.documentElement)
                .getPropertyValue("--blazor-load-percentage");
            const resourceProgress = Number.parseFloat(rawProgress);
            if (Number.isFinite(resourceProgress))
                minimalBastionLoading.update(0.08 + resourceProgress * 0.0062, "DOWNLOADING GAME DATA");
            window.requestAnimationFrame(trackFrameworkLoading);
        }
        window.requestAnimationFrame(trackFrameworkLoading);
        Blazor.start()
            .then(() => {
                frameworkLoading = false;
                minimalBastionLoading.update(0.72, "PREPARING GAME ASSEMBLIES");
            })
            .catch(error => {
                frameworkLoading = false;
                console.error("Browser startup failed", error);
                minimalBastionLoading.fail();
            });
    </script>
    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>
    <script src="js/game-host.js"></script>
</body>
</html>
