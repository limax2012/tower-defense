name: maximal_bastion_mobile
description: Maximal Bastion with a touch interface and the shared C# game engine.
publish_to: none
version: 0.2.0+2
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.23.0
  path_provider: ^2.1.5
  web: ^1.1.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    # Runtime assets are generated by scripts/prepare-mobile.ps1.
    # runtime-assets-start
    - assets/runtime/
    - assets/runtime/_content/
    - assets/runtime/_content/nkast.Wasm.Audio/
    - assets/runtime/_content/nkast.Wasm.Audio/js/
    - assets/runtime/_content/nkast.Wasm.Canvas/
    - assets/runtime/_content/nkast.Wasm.Canvas/js/
    - assets/runtime/_content/nkast.Wasm.Dom/
    - assets/runtime/_content/nkast.Wasm.Dom/js/
    - assets/runtime/_content/nkast.Wasm.JSInterop/
    - assets/runtime/_content/nkast.Wasm.JSInterop/js/
    - assets/runtime/_content/nkast.Wasm.XHR/
    - assets/runtime/_content/nkast.Wasm.XHR/js/
    - assets/runtime/_content/nkast.Wasm.XR/
    - assets/runtime/_content/nkast.Wasm.XR/js/
    - assets/runtime/_framework/
    - assets/runtime/Content/
    - assets/runtime/Content/Audio/
    - assets/runtime/Content/Audio/Music/
    - assets/runtime/Content/Fonts/
    - assets/runtime/css/
    - assets/runtime/fonts/
    - assets/runtime/js/
    # runtime-assets-end
