<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#060b16" />
    <title>Maximal Bastion</title>
    <base href="./" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/BarlowSemiCondensed-Medium.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="fonts/Oxanium-SemiBold.ttf" as="font" type="font/ttf" crossorigin />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="browser-loading" class="loading-screen" role="status" aria-live="polite">
        <img class="loading-mark" src="favicon.svg" alt="" width="120" height="120" />
        <div id="browser-loading-title" class="loading-title">MAXIMAL BASTION</div>
        <div id="browser-loading-copy" class="loading-copy">Loading game</div>
        <div class="loading-activity" aria-hidden="true">
            <span></span><span></span><span></span>
        </div>
    </div>
    <div id="app"></div>

    <div id="blazor-error-ui" role="alert">
        <span id="browser-error-summary">The browser build stopped unexpectedly.</span>
        <a href="">Reload</a>
    </div>

    <script src="native-bootstrap.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        window.maximalBastionLoading = (() => {
            const overlay = document.getElementById("browser-loading");
            const title = document.getElementById("browser-loading-title");
            const copy = document.getElementById("browser-loading-copy");
            return {
                begin(heading, message) {
                    if (title) title.textContent = heading || "MAXIMAL BASTION";
                    if (copy) copy.textContent = message || "Loading game";
                    overlay?.classList.remove("complete");
                },
                update(message) {
                    if (copy) copy.textContent = message || "Loading game";
                },
                complete() {
                    window.requestAnimationFrame(() => window.requestAnimationFrame(() => overlay?.classList.add("complete")));
                },
                fail(message) {
                    overlay?.classList.add("complete");
                    if (message) {
                        const summary = document.getElementById("browser-error-summary");
                        if (summary) summary.textContent = message;
                        document.getElementById("blazor-error-ui")?.classList.add("visible");
                    }
                }
            };
        })();
        maximalBastionLoading.update("Downloading game data");
        Blazor.start()
            .then(() => {
                maximalBastionLoading.update("Preparing game");
            })
            .catch(error => {
                console.error("Browser startup failed", error);
                maximalBastionLoading.fail("Unable to start Maximal Bastion. Reload to try again.");
            });
    </script>
    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>
    <script src="js/game-host.js"></script>
</body>
</html>
